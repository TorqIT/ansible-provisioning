- name: Run common role
  hosts: all
  become: true
  roles:
    - role: torqit.provisioning.common

- name: Servers running Opensearch
  hosts: opensearch
  roles:
    - role: torqit.provisioning.opensearch

- name: Servers running Mercure
  hosts: mercure
  roles:
    - role: torqit.provisioning.mercure

- name: Servers running Gotenberg for Web2Print
  hosts: gotenberg
  roles:
    - role: torqit.provisioning.gotenberg

- name: Servers running a Blackfire agent
  hosts: blackfire
  roles:
    - role: torqit.provisioning.blackfire

- name: Servers running Netdata agents
  hosts: netdata
  roles:
    - role: torqit.provisioning.netdata

- name: Servers running Pimcore Agent server agent
  hosts: pimcore_agent_server
  roles:
  - role: torqit.provisioning.pimcore_agent_server

- name: Pimcore application servers
  hosts: pimcore_application_servers
  roles:
    - role: torqit.provisioning.github_runner
    - role: torqit.provisioning.nginx_proxy

- name: MySQL servers
  hosts: mysql_servers
  roles:
    - role: torqit.provisioning.mysql

- name: MariaDB servers
  hosts: mariadb_servers
  roles:
    - role: torqit.provisioning.mariadb
