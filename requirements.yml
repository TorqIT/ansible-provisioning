# Collection dependencies (community.general, community.docker, ansible.posix)
# are declared in galaxy.yml and installed automatically when the
# torqit.provisioning collection itself is installed. These roles aren't
# collections, so they still need to be installed separately.
roles:
  - name: geerlingguy.docker
  - name: geerlingguy.pip
  - name: monolithprojects.github_actions_runner
    version: "1.25.1"
    src: https://github.com/MonolithProjects/ansible-github_actions_runner
