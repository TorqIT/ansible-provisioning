- name: Ensure /etc/nginx/conf.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create custom NGINX conf file allowing large uploads
  become: true
  ansible.builtin.copy:
    mode: 0644
    dest: "/etc/nginx/conf.d/large-uploads.conf"
    force: true
    content: |
      client_max_body_size 50G;

- name: Create custom NGINX conf file enabling gzip compression
  become: true
  ansible.builtin.copy:
    mode: 0644
    dest: "/etc/nginx/conf.d/gzip.conf"
    force: true
    content: |
      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level 5;
      gzip_http_version 1.1;
      gzip_types
          text/plain
          text/css
          application/json
          application/javascript
          text/xml
          application/xml
          application/xml+rss
          text/javascript
          text/vnd.turbo-stream.html;

- name: Create NGINX Docker network
  community.docker.docker_network:
    name: "{{ nginx_network }}"
    internal: false

- name: Set common volumes for nginx-proxy
  ansible.builtin.set_fact:
    nginx_proxy_common_volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-html:/usr/share/nginx/html
      - /etc/nginx/vhost.d:/etc/nginx/vhost.d:ro
      - /etc/nginx/conf.d/large-uploads.conf:/etc/nginx/conf.d/large-uploads.conf:ro
      - /etc/nginx/conf.d/gzip.conf:/etc/nginx/conf.d/gzip.conf:ro

- name: Set nginx_cert volume (when acme_companion = true)
  ansible.builtin.set_fact:
    nginx_proxy_cert_volumes:
      - "{{ nginx_certs_volume }}:/etc/nginx/certs"
  when: use_acme_companion

- name: If using certbot for certificates, mount Let's Encrypt certificates directory
  ansible.builtin.set_fact:
    nginx_proxy_cert_volumes:
      - "{{ letsencrypt_certs_host_directory }}/fullchain.pem:/etc/nginx/certs/{{ domain_name }}.crt:ro"
      - "{{ letsencrypt_certs_host_directory }}/privkey.pem:/etc/nginx/certs/{{ domain_name }}.key:ro"
  when: not use_acme_companion and use_certbot

- name: Ensure certbot renewal-hooks/deploy directory exists
  become: true
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not use_acme_companion and use_certbot

- name: Deploy certbot renewal hook to restart nginx-proxy after cert renewal
  become: true
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/restart-nginx-proxy.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      # nginx-proxy bind-mounts the individual cert files, which are symlinks
      # certbot repoints on renewal; the container only re-resolves them on restart.
      /usr/bin/docker restart nginx-proxy
  when: not use_acme_companion and use_certbot

- name: If not using acme_companion or certbot, mount manually-managed certificates directory
  ansible.builtin.set_fact:
    nginx_proxy_cert_volumes:
      - "{{ nginx_certs_host_directory }}:/etc/nginx/certs:ro"
  when: not use_acme_companion and not use_certbot

- name: Combine all volumes
  ansible.builtin.set_fact:
    nginx_proxy_volumes: "{{ nginx_proxy_cert_volumes + nginx_proxy_common_volumes }}"

- name: Pull and run nginx-proxy container
  become: true
  community.docker.docker_container:
    name: nginx-proxy
    pull: always
    image: nginxproxy/nginx-proxy:1.7@sha256:d8a53e059d5e649cbeb5a70b5231296d4a5e8042d721d4313cf3d20987996844
    restart_policy: "always"
    networks:
      - name: "{{ nginx_network }}"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes: "{{ nginx_proxy_volumes }}"

- name: Pull and run nginx-proxy-acme-companion container
  when: use_acme_companion
  community.docker.docker_container:
    name: nginx-proxy-acme-companion
    pull: always
    image: nginxproxy/acme-companion:2.5@sha256:308dd273fafec21ce5ea22e830adbf9248a9be18d1caff9f94be321ae9835015
    restart_policy: "always"
    networks:
      - name: "{{ nginx_network }}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - nginx-acme:/etc/acme.sh
    env:
      NGINX_PROXY_CONTAINER: nginx-proxy
