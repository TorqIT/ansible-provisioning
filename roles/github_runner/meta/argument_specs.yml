argument_specs:
  main:
    short_description: Installs and registers a self-hosted GitHub Actions runner as a systemd service.
    options:
      github_repo_url:
        type: str
        required: true
        description: Repository URL to register the runner against.
      github_runner_token:
        type: str
        required: true
        no_log: true
        description: Registration token from the repo's Settings > Actions > Runners > New runner page. Only consumed the first time the runner is configured.
      github_runner_name:
        type: str
        required: true
        description: Name the runner is registered under in GitHub.
      github_runner_labels:
        type: str
        default: "self-hosted,Linux,X64"
        description: >-
          Comma-separated labels the runner is registered with. If a workflow's
          runs-on targets a label (e.g. a branch name), that label must be
          included here or the runner will never be assigned matching jobs.
      github_runner_work_directory:
        type: str
        default: "_work"
        description: Name of the runner's work directory, relative to its actions-runner directory.
      github_runner_version:
        type: str
        default: "2.317.0"
        description: Version of the actions/runner release to download and install.
      github_runner_user:
        type: str
        default: "runner"
        description: Local user the runner is installed and run as; its home directory becomes /home/<user>/actions-runner.
