- name: Pull and run Mercure container
  community.docker.docker_container:
    name: mercure
    pull: always
    state: started
    image: dunglas/mercure:v0.24.2@sha256:916834e499613d475e9ad5118cd2349875338f52d99d65b58aeff82f97ccb0c6
    restart_policy: always
    volumes:
      - mercure-data:/usr/share/opensearch/data
      - mercure-config:/config
    env:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "{{ mercure_jwt_key }}"
      MERCURE_SUBSCRIBER_JWT_KEY: "{{ mercure_jwt_key }}"
    ports:
      - "80:80/tcp"


