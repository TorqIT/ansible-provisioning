- name: Log in to the Container Registry
  community.docker.docker_login:
    registry_url: "{{ acr_registry_url }}"
    username: "{{ acr_username }}"
    password: "{{ acr_password }}"

- name: Ensure agent-server's volumes are writable by its container user (uid 1000)
  community.docker.docker_container:
    name: agent-server-fix-volume-ownership
    image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command: chown -R 1000:1000 /data /uploads
    volumes:
      - agent-server-copilot-state:/data
      - agent-server-uploads:/uploads
    detach: false
    cleanup: true

- name: Pull and run agent-server container
  community.docker.docker_container:
    name: agent-server
    pull: always
    state: started
    image: "{{ acr_registry_url }}/agent-server:latest"
    restart_policy: always
    # Host networking so agent-server can reach the Mercure container via localhost
    network_mode: host
    volumes:
      - agent-server-copilot-state:/app/.copilot-state
      - agent-server-uploads:/app/uploads
    env:
      NODE_ENV: production
      PORT: "3032"
      PIMCORE_INTERNAL_URL: "{{ pimcore_internal_url }}"
      AGENT_SERVER_ADMIN_TOKEN: "{{ agent_server_admin_token }}"
      MERCURE_SERVER_URL: "http://localhost/.well-known/mercure"
      MERCURE_JWT_KEY: "{{ mercure_jwt_key }}"
      ANTHROPIC_API_KEY: "{{ anthropic_api_key }}"
      OPEN_AI_AUTH_TOKEN: "{{ open_ai_auth_token }}"
      AGENT_SERVER_COPILOT_API_KEY: "{{ agent_server_copilot_api_key }}"
      AGENT_SERVER_COPILOT_AUTH_MODE: "{{ agent_server_copilot_auth_mode | default(omit) }}"
      AGENT_SERVER_COPILOT_PROVIDER: "{{ agent_server_copilot_provider | default(omit) }}"
      AGENT_SERVER_COPILOT_MODEL: "{{ agent_server_copilot_model | default(omit) }}"
      AGENT_SERVER_TITLE_MODEL: "{{ agent_server_title_model | default(omit) }}"
      AGENT_SERVER_AVAILABLE_MODELS: "{{ agent_server_available_models | default(omit) }}"
