- name: Log in to the Container Registry
  community.docker.docker_login:
    registry_url: "{{ acr_registry_url }}"
    username: "{{ acr_username }}"
    password: "{{ acr_password }}"

# A fresh named volume is initialized root-owned when there's nothing at the mount path to copy
# ownership from (agent-server's Dockerfile only chowns /app to the node user, uid 1000, at build
# time - .copilot-state doesn't exist until this volume is mounted at runtime), which crashes the
# Copilot runtime with EACCES on startup. Idempotent - safe to re-run on every deploy.
- name: Ensure agent-server's volumes are writable by its container user (uid 1000)
  community.docker.docker_container:
    name: agent-server-fix-volume-ownership
    image: alpine
    command: chown -R 1000:1000 /data /uploads
    volumes:
      - agent-server-copilot-state:/data
      - agent-server-uploads:/uploads
    detach: false
    cleanup: true

- name: Pull and run agent-server container
  community.docker.docker_container:
    name: agent-server
    pull: always
    state: started
    image: "{{ acr_registry_url }}/agent-server:latest"
    restart_policy: always
    # Host networking so agent-server can reach the Mercure container via plain localhost, without needing a shared user-defined Docker network.
    network_mode: host
    volumes:
      - agent-server-copilot-state:/app/.copilot-state
      - agent-server-uploads:/app/uploads
    env:
      NODE_ENV: production
      PORT: "3032"
      PIMCORE_INTERNAL_URL: "{{ pimcore_internal_url }}"
      AGENT_SERVER_ADMIN_TOKEN: "{{ agent_server_admin_token }}"
      ANTHROPIC_API_KEY: "{{ anthropic_api_key }}"
      OPEN_AI_AUTH_TOKEN: "{{ open_ai_auth_token }}"
      MERCURE_SERVER_URL: "http://localhost/.well-known/mercure"
      MERCURE_JWT_KEY: "{{ mercure_jwt_key }}"
