- name: Force remove grub-pc if in a broken dpkg state (VM disk detection incompatibility)
  become: true
  ansible.builtin.shell: |
    status=$(dpkg-query -W -f='${db:Status-Abbrev}' grub-pc 2>/dev/null)
    if [ -n "$status" ] && [ "$status" != "ii " ]; then
      dpkg --remove --force-remove-reinstreq grub-pc
    fi
  changed_when: false
  failed_when: false

- name: Hold grub-pc to prevent VM disk detection failures during upgrade
  become: true
  ansible.builtin.dpkg_selections:
    name: grub-pc
    selection: hold

- name: Update packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: true

- name: Check if reboot required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot if required
  ansible.builtin.reboot:
  when: reboot_required_file.stat.exists and trigger_reboots is defined and trigger_reboots
