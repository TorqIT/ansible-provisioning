argument_specs:
  main:
    short_description: Baseline OS/Docker setup and CVE mitigations applied to every host.
    options:
      docker_data_root:
        type: str
        default: /var/lib/docker
        description: Directory Docker should store images/containers/volumes in. Moved via daemon.json + a Docker restart if not the default.
      trigger_reboots:
        type: bool
        default: true
        description: Whether to automatically reboot the host when a package upgrade or CVE mitigation requires it.
      pip_install_packages:
        type: list
        elements: dict
        default:
          - name: docker
        description: Packages passed to the geerlingguy.pip role (needed by geerlingguy.docker).
