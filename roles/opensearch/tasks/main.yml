# Recommended by Opensearch documentation (https://opensearch.org/docs/latest/install-and-configure/install-opensearch/index/#important-settings)
- name: Increase vm.max_map_count value
  become: true
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present

- name: Pull and run Opensearch container
  community.docker.docker_container:
    name: opensearch
    pull: always
    state: started
    image: opensearchproject/opensearch:2
    restart_policy: always
    env:
      node.name: "opensearch"
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: "single-node"
      OPENSEARCH_JAVA_OPTS: "{{ opensearch_java_opts }}"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      indices.query.bool.max_clause_count: "{{ opensearch_indices_query_bool_max_clause_count }}"
      action.auto_create_index: "{{ opensearch_auto_create_index }}"
    ulimits:
      - memlock:-1:-1
      - nofile:65536:65536
    capabilities:
      - IPC_LOCK
    volumes:
      - opensearch:/usr/share/opensearch/data
    ports:
      - "9200:9200/tcp"
